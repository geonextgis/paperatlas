# ============================================================
# query_config.yml
# Edit this file to customise which publications are fetched.
# No Python or workflow files need to be changed.
#
# This site is a research-interest feed. Each query below
# (each topic term, each keyword, each journal, each extra
# query) fetches up to `fetch.results_per_query` of the most
# recent matching papers (default 50). Papers can ONLY come
# from journals listed in `journals_of_interest`. If a query
# has no match in those journals, it simply contributes
# nothing — that's fine.
# ============================================================

# ── Site identity (used only for page title / header text) ──
site:
  title: "Krishnagopal Halder — Research Feed"
  subtitle: "A weekly updated personalized research feed."

# ── Topic interest search ────────────────────────────────────
# Broad themes. Each term becomes its own query:
#   TS=("term") AND SO=(<journals_of_interest>)
# Use WoS wildcard syntax: * for suffix (e.g. "model*" matches modeling, models).
topic_query:
  terms:
    - '"crop model*"'
    - '"crop yield*"'
    - '"agricultural system*"'
    - '"precision agriculture"'
    - '"food security" AND crop*'
    - '"climate change" AND crop*'
    - '"agriculture" AND "deep learning"'
    - '"agriculture" AND "machine learning"'
    - '"crop yield*" AND "deep learning"'
    - '"crop yield*" AND "machine learning"'
    - '"remote sensing" AND "deep learning" AND agriculture'
    - '"remote sensing" AND "machine learning" AND agriculture'
    - '"agriculture" AND "generative AI"'
    - '"agriculture" AND "generative model*"'
    - '"agriculture" AND "foundation model*"'
    - '"crop yield*" AND "generative model*"'
    - '"remote sensing" AND "generative model*" AND agriculture'
    - '"remote sensing" AND "diffusion model*" AND agriculture'
    - '"remote sensing" AND "transformer*" AND agriculture'
    - '"agriculture" AND "large language model*"'
    - '"precision agriculture" AND "foundation model*"'

  # Optional: restrict topic and keyword queries to a publication-year range.
  # Use integers or the special token CURRENT_YEAR. Leave blank (null) for all years.
  year_from: 2026
  year_to: 2026

# ── Keyword search ───────────────────────────────────────────
# Specific tags or phrases. Each entry becomes its own query, identical in
# mechanics to topic terms but tagged with `source: "keyword"` so the feed can
# distinguish them. Use WoS wildcard `*` for suffix matching.
keywords:
  - "remote sensing"
  - "deep learning"
  - "machine learning"
  - "GeoAI"
  - "precision agriculture"
  - "agriculture"
  - "computer vision"
  - "generative AI"
  - "generative models"
  - "foundation models"
  - "diffusion models"
  - "transformers"
  - "large language models"
  - "multimodal learning"

# ── Journals of interest (the strict allow-list) ────────────
# Used to:
#   1. Scope every topic, keyword and extra query via SO=(<journals_of_interest>).
#   2. Drive a per-journal fetch — the latest papers from each are included.
#   3. Populate the "Filter by Journal" dropdown on the website.
# A post-fetch guard drops any record whose source title isn't on this list.
# Use exact journal names as they appear in Web of Science (SO= field).
journals_of_interest:
  # Core Nature / high impact
  - "NATURE FOOD"
  - "NATURE CLIMATE CHANGE"
  - "NATURE COMMUNICATIONS"
  - "NATURE SUSTAINABILITY"
  - "NATURE MACHINE INTELLIGENCE"
  - "SCIENCE ADVANCES"

  # Remote sensing & EO
  - "REMOTE SENSING OF ENVIRONMENT"
  - "ISPRS JOURNAL OF PHOTOGRAMMETRY AND REMOTE SENSING"
  - "INTERNATIONAL JOURNAL OF APPLIED EARTH OBSERVATION AND GEOINFORMATION"
  - "IEEE TRANSACTIONS ON GEOSCIENCE AND REMOTE SENSING"

  # Agriculture & food systems
  - "COMPUTERS AND ELECTRONICS IN AGRICULTURE"
  - "ARTIFICIAL INTELLIGENCE IN AGRICULTURE"
  - "AGRICULTURAL AND FOREST METEOROLOGY"
  - "FIELD CROPS RESEARCH"
  - "EUROPEAN JOURNAL OF AGRONOMY"
  - "AGRICULTURAL SYSTEMS"

# ── Additional named queries (optional) ─────────────────────
# Each entry: { label: str, query: str }. The query is AND-combined with the
# journals_of_interest SO=(...) clause and tagged as `extra:<label>`.
extra_queries: []
# Example:
# extra_queries:
#   - label: "ZALF group output"
#     query: 'OG=("Leibniz Centre for Agricultural Landscape Research")'

# ── arXiv preprint server ───────────────────────────────────
# Pulls the latest preprints from arXiv that match the queries
# below. Set `enabled: false` to skip arXiv entirely.
#
# arXiv records bypass the `journals_of_interest` allow-list
# (preprints aren't in journals). They show up under the
# "arXiv" publisher tab. When an arXiv preprint has been
# published in a tracked journal, the records merge by DOI so
# you don't see duplicates.
#
# arXiv search syntax:
#   ti:"crop model"            — title
#   abs:"deep learning"        — abstract
#   all:agriculture            — anywhere
#   cat:cs.LG                  — primary or cross-listed category
#   AND / OR / ANDNOT
# If both `query` and `categories` are set, each query is
# AND-combined with `(cat:c1 OR cat:c2 ...)`.
arxiv:
  enabled: true
  queries:
    - label: "Crop modelling + ML"
      query: 'all:"crop model" AND (all:"deep learning" OR all:"machine learning")'
    - label: "Crop yield + DL"
      query: 'all:"crop yield" AND (all:"deep learning" OR all:"machine learning")'
    - label: "Remote sensing for agriculture"
      query: 'all:"remote sensing" AND all:agriculture'
    - label: "Sentinel-2 + agriculture"
      query: 'all:"Sentinel-2" AND all:agriculture'
    - label: "Precision agriculture"
      query: 'all:"precision agriculture"'
    - label: "GeoAI"
      query: 'all:GeoAI OR (all:"geospatial" AND all:"deep learning")'
    - label: "Generative AI for agriculture"
      query: 'all:agriculture AND (all:"generative AI" OR all:"generative model")'
    - label: "Diffusion models + remote sensing"
      query: 'all:"remote sensing" AND all:"diffusion model"'
    - label: "Foundation models for Earth observation"
      query: '(all:"foundation model" OR all:"foundation models") AND (all:"remote sensing" OR all:"Earth observation")'
    - label: "LLMs in agriculture"
      query: 'all:agriculture AND (all:"large language model" OR all:"LLM")'
  # AND-restrict every query to these arXiv categories. Leave
  # the list empty to search across all categories.
  categories:
    - cs.LG
    - cs.CV
    - stat.ML
    - eess.IV
  # Up to this many most recent preprints are pulled per query.
  results_per_query: 10
  # Drop preprints older than this many days. Use null for no
  # age limit. Combined with `topic_query.year_from` /
  # `year_to` above — both filters apply (a record must pass
  # the year range AND be no older than max_age_days). Set
  # max_age_days: null if you only want the year range to
  # decide.
  max_age_days: 365

# ── Fetch settings ───────────────────────────────────────────
fetch:
  # Up to this many most recent papers are pulled per query. WoS pages of 50
  # are fetched and concatenated. Set higher to grow the feed; lower to keep it
  # lean. The website is designed to comfortably display 50+ papers.
  results_per_query: 10
  requests_per_second: 2
  retry_attempts: 3
  retry_backoff_seconds: 5
