<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Krishnagopal Halder — Research Feed</title>
    <meta
      name="description"
      content="Latest publications in GeoAI, remote sensing, AI, and agriculture — curated for Krishnagopal Halder, ZALF."
    />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("paperatlas-theme");
          var prefersLight =
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: light)").matches;
          var theme = saved || (prefersLight ? "light" : "dark");
          document.documentElement.setAttribute("data-theme", theme);
        } catch (_) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700;900&family=Source+Serif+4:ital,wght@0,300;0,400;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="site-header">
      <div class="header-inner">
        <div class="researcher-identity">
          <p class="researcher-eyebrow">Research Feed</p>
          <h1 class="researcher-name" id="siteTitle">Krishnagopal Halder</h1>
          <p class="researcher-affiliation" id="siteSubtitle">
            Latest in GeoAI, remote sensing, artificial intelligence, and
            agriculture · Leibniz Centre for Agricultural Landscape Research
            (ZALF)
          </p>
        </div>
        <div class="header-meta">
          <span class="last-updated" id="lastUpdated">Loading…</span>
          <span class="meta-sep" aria-hidden="true">·</span>
          <span class="pub-count" id="pubCount"></span>
          <button
            class="theme-toggle"
            id="themeToggle"
            type="button"
            aria-label="Toggle light / dark theme"
            title="Toggle theme"
          >
            <svg
              class="icon-moon"
              viewBox="0 0 24 24"
              width="17"
              height="17"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z" />
            </svg>
            <svg
              class="icon-sun"
              viewBox="0 0 24 24"
              width="17"
              height="17"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <circle cx="12" cy="12" r="4" />
              <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" />
            </svg>
          </button>
        </div>
      </div>
    </header>

    <div class="toolbar" role="region" aria-label="Filter publications">
      <div class="toolbar-inner">
        <div class="search-row">
          <svg
            class="search-icon"
            viewBox="0 0 24 24"
            width="18"
            height="18"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <circle cx="11" cy="11" r="7" />
            <path d="m20 20-3.5-3.5" />
          </svg>
          <input
            type="search"
            id="searchInput"
            placeholder="Search publications, authors, keywords…"
            class="search-input"
            aria-label="Search publications"
          />
        </div>

        <div class="select-row">
          <label class="select-field">
            <span class="select-label">Journal</span>
            <select
              id="journalSelect"
              class="select-control"
              aria-label="Filter by journal"
            >
              <option value="">All journals</option>
            </select>
          </label>

          <label class="select-field">
            <span class="select-label">Sort</span>
            <select id="sortSelect" class="select-control" aria-label="Sort">
              <option value="year">Newest first</option>
              <option value="cited">Most cited</option>
              <option value="alpha">A → Z</option>
            </select>
          </label>

          <span class="result-count" id="resultCount" aria-live="polite"></span>
        </div>

        <nav
          class="publisher-tabs"
          id="publisherTabs"
          role="tablist"
          aria-label="Filter by publisher"
        >
          <button
            class="publisher-tab is-active"
            data-publisher=""
            type="button"
            role="tab"
            aria-selected="true"
          >
            All publishers
          </button>
        </nav>

        <div
          class="year-chips"
          id="yearFilter"
          role="group"
          aria-label="Filter by year"
        ></div>
      </div>
    </div>

    <main class="publications-grid" id="pubGrid" aria-live="polite">
      <div class="loading-state">Fetching publications…</div>
    </main>

    <footer class="site-footer">
      <p>
        Data sourced from
        <a
          href="https://clarivate.com/academia-government/scientific-academic-research/web-of-science/"
          target="_blank"
          rel="noopener"
          >Web of Science</a
        >
        · Updated weekly via GitHub Actions
      </p>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
