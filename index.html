<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Krishnagopal Halder — Research Feed</title>
    <meta
      name="description"
      content="Latest publications in crop modelling, nitrogen dynamics, and agricultural AI — curated for Krishnagopal Halder, ZALF."
    />
    <script>
      // Apply theme before paint to avoid flash.
      (function () {
        try {
          var saved = localStorage.getItem("paperatlas-theme");
          var prefersLight =
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: light)").matches;
          var theme = saved || (prefersLight ? "light" : "dark");
          document.documentElement.setAttribute("data-theme", theme);
        } catch (_) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Source+Serif+4:ital,wght@0,300;0,400;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="site-header">
      <div class="header-inner">
        <div class="researcher-identity">
          <p class="researcher-eyebrow">Research Feed</p>
          <h1 class="researcher-name" id="siteTitle">Krishnagopal Halder</h1>
          <p class="researcher-affiliation" id="siteSubtitle">
            Latest publications in crop modelling, nitrogen dynamics, and
            agricultural AI · Leibniz Centre for Agricultural Landscape
            Research (ZALF)
          </p>
        </div>
        <div class="header-meta">
          <button
            class="theme-toggle"
            id="themeToggle"
            type="button"
            aria-label="Toggle light / dark theme"
            title="Toggle theme"
          >
            <span class="theme-icon" aria-hidden="true">☾</span>
            <span class="theme-label">Theme</span>
          </button>
          <span class="last-updated" id="lastUpdated">Loading…</span>
          <span class="pub-count" id="pubCount"></span>
        </div>
      </div>
    </header>

    <div class="controls-bar" role="region" aria-label="Filter publications">
      <input
        type="search"
        id="searchInput"
        placeholder="Search publications, authors, keywords…"
        class="search-input"
        aria-label="Search publications"
      />

      <div class="filter-row">
        <div class="filter-pills" role="group" aria-label="Type filter">
          <button class="pill active" data-filter="all" type="button">All</button>
          <button class="pill" data-filter="oa" type="button">Open Access</button>
        </div>

        <select
          id="journalSelect"
          class="journal-select"
          aria-label="Filter by journal"
        >
          <option value="">All Journals</option>
        </select>

        <select id="sortSelect" class="sort-select" aria-label="Sort">
          <option value="year">Newest First</option>
          <option value="cited">Most Cited</option>
          <option value="alpha">A → Z</option>
        </select>
      </div>
    </div>

    <div class="year-filter" id="yearFilter" role="group" aria-label="Year filter"></div>

    <main class="publications-grid" id="pubGrid" aria-live="polite">
      <div class="loading-state">Fetching publications…</div>
    </main>

    <footer class="site-footer">
      <p>
        Data sourced from
        <a
          href="https://clarivate.com/academia-government/scientific-academic-research/web-of-science/"
          target="_blank"
          rel="noopener"
          >Web of Science</a
        >
        · Updated weekly via GitHub Actions
      </p>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
